name: Checks

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Nothing to install: the validator only needs Node. --strict-previews
      # fails the run when r/ is out of date, so `npm run previews` isn't forgotten.
      - run: npm run validate -- --strict-previews

  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run links

  smoke:
    name: Play the quiz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke

  # Publishes the site to gh-pages once every check passes on main: the same
  # copy as the manual deploy in the README, keeping CNAME and .nojekyll.
